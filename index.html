<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>online book store</title>
    <style>
        .header{
            background:orange;
            height: 80px;
            font-size:30px;
            display:flex;
            align-items: center;
            text-align: center;
            
        }
         .logo{
            width: 150PX;
            
            
         }
         .logo img{
            width:70px;
            height:70px;
         }
         .title{
            font-weight:bold;
            flex:1;
            text-align: center;
            
         }
        .menu{
            background: rgb(93, 80, 128);
            display:flex;
            height:50px;
            justify-content:space-around;
            align-items:center;

        }
        .main{
            display:flex;
            height:400px;
        }
        .menu a{
            text-decoration:none;
            color:rgba(107, 13, 13, 0.892);
            font-weight:bold;

           
            
        }
        .left{
            width:200px;
            border:1px solid black;
            display:flex;
            flex-direction:column;
            justify-content:space-around;
            padding:10px;
        
        }
        .left a{
            text-decoration:none;
        }
        .right{
            flex:1;
            border:1px solid black;
            padding:20px;
        }
        .right iframe{
            width:100%;
            height:100%;
            border:none;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <img src="logo.png" alt="college logo">
            </div>
        <div class="title" >online book store</div>   

        
    </div>
    <div class="menu">

    </div>
    <div class="main">
     <div class="left">
        <a href="cse.html">CSE</a>
        <a href="civil.html">CIVIL</a>
        <a href="electrical.html">EEE</a>
        <a href="electronics.html">ECE</a>
     </div>
     <div class="right">
        <iframe src="home.html" name="content">
            
        </iframe>
     </div>

</html>
