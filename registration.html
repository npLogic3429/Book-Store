<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registration</title>
</head>
<body>
    <h1>Registration page</h1>
    <div>
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="enter your name">
        <br><br>
        <label for="password">Password:</label>
        <input type="Password" id="password" placeholder="enter the password">
        <br><br>
        <label for="email id">E-mailid:</label>
        <input type="text" id="email id" placeholder="enter the email id">
        <br><br>
        <label for="phone number">phone number:</label>
        <input type="text" id="phone number" placeholder="enter the phone number">
        <br><br>
        <label for="gender">Gender:</label>
        <label for="gender">Male</label>
        <input type="radio" id="gender" name="gender">
        <label for="gender">Female</label>
        <input type="radio" id="gender" name="gender">
        <br><br>
        <label for="date">DOB:</label>
        <input type="date" id="date">
        <br><br>
        <label for="language">Language known:</label>
        <label for="language">English</label>
        <input type="checkbox"id="language">
        <label for="language">Telgu</label>
        <input type="checkbox"id="language">
        <label for="language">Hindi</label>
        <input type="checkbox" id="language">
        <label for="language">Tamil</label>
        <input type="checkbox" id="language">
        <br><br>
        <label for="address">Address:</label>
        <input type="text"id="address" placeholder="enter your address">
        <br><br>
        <Button type="Register">Register</Button>
        <Button type="Reset">Reset</Button>

    </div>
</body>
</html>
